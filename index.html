<!DOCTYPE html>
<!--
=====================================================================
 충현교회 1교구 소식지  (직접 수정하실 수 있도록 설명을 달아 둔 파일)
=====================================================================
 ★ [소식지_7] 이제 소식 내용은 '구글 시트'에서 고칩니다. 이 파일은 거의 고칠 일이 없습니다.
 ★ 구글 시트 주소(번호)는 아래 <script> 의 "② -2 구글 시트 연결" 부분(SHEET_ID)에 있습니다.
 ★ 인터넷이 안 되거나 시트를 못 읽으면, 아래 "데이터"에 적힌 내용(기본값)이 대신 나옵니다.
 ★ 소식지 날짜와 교구모임기도 날짜는 휴대폰 날짜를 보고 일요일 기준으로 자동 계산됩니다.
 ★ 기본값 수정: 아래쪽 <script> 안의 "데이터" 부분 (글자·이름·전화번호·날짜)
 ★ 색깔 수정     : 아래 <style> 맨 위의 "색깔 모음" 부분
 ★ 이 파일 하나에 로고와 배경 사진까지 모두 들어 있습니다. (맨 아래 "그림 데이터" 부분)
 ★ 그림 데이터는 아주 길어서 맨 아래에 따로 모아 두었습니다. 수정하지 마세요.

 [수정할 때 주의]
 1. 따옴표(" ")와 쉼표(,)는 지우지 마세요. 글자만 바꾸세요.
 2. 글자 안에 따옴표를 넣고 싶으면 \" 처럼 앞에 \ 를 붙이세요.
 3. 수정 전에 원본 파일을 복사해서 보관해 두세요. 잘못되면 다시 쓰면 됩니다.
 4. 메모장으로 열어서 수정해도 되고, 저장할 때 "UTF-8" 로 저장하세요.
 5. 별표(/* */)나 슬래시 두 개(//) 뒤에 적힌 글, 그리고 꺾쇠로 된 설명 글은 "설명(주석)"입니다. 화면에는 안 나옵니다.
=====================================================================
-->
<html lang="ko">
<head>
<meta charset="utf-8"> <!-- 한글이 깨지지 않게 하는 설정 (수정 금지) -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"> <!-- 휴대폰 화면 크기에 맞추는 설정 (수정 금지) -->
<title>충현교회 1교구 소식지</title> <!-- 인터넷 창 위쪽에 보이는 제목 -->
<meta property="og:title" content="충현교회 1교구 소식지"> <!-- 카카오톡에 링크를 올릴 때 보이는 제목 -->
<meta property="og:description" content="1교구 소식을 확인하세요"> <!-- 카카오톡에 링크를 올릴 때 보이는 설명 글 -->
<link rel="preconnect" href="http://webzine.choonghyunchurch.or.kr"> <!-- 주간충현 서버와 미리 연결해 두는 설정. 누를 때 대기 시간을 조금 줄입니다 (주소를 바꾸면 여기도 같이 바꾸세요) -->
<link rel="dns-prefetch" href="//webzine.choonghyunchurch.or.kr"> <!-- 주간충현 서버 주소를 미리 찾아 두는 설정 (위와 같은 목적) -->
<style>
/* =====================================================================
   [색깔 · 모양 설정]  - 화면의 색과 크기를 정하는 곳입니다.
   색깔은 #으로 시작하는 6자리 번호입니다. (예: #ffffff = 흰색, #000000 = 검정)
   "색상 선택기"나 "HTML color picker"를 검색하면 원하는 색의 번호를 찾을 수 있습니다.
   ===================================================================== */

/* ▼ 색깔 모음: 여기 번호만 바꾸면 화면 전체의 해당 색이 바뀝니다 */
:root{
 --y:#ffe930;      /* 맨 위 제목 줄(노란색) */
 --ink:#1b1b1b;   /* 기본 글자색(거의 검정) */
 --bg:#eef1f4;     /* 화면 바깥 배경색(연한 회색) */
 --p1:#ffffd6;     /* '교회 소식' 화면 배경색(연한 노랑) */
 --p2:#a4c8c6;     /* '교구 소식' 화면 배경색(연한 청록) */
 --p3:#ffffff;     /* '환우 명단' 화면 배경색(흰색) */
 --line:#222;      /* 환우 명단의 줄 색 */
 --card:#e3b4b4;   /* (지금은 사용하지 않음) */
 --gray:#8f9a9a;   /* '교구모임기도' 글자가 있는 칸의 회색 */
 --brown:#c9b9ad;  /* 교구모임기도 표의 '날짜' 칸 색(밝은 갈색) */
 --gold:#ffc107;   /* 하단 '교구 협력 교회' 줄의 노란색(금색) */
 --chip:#eddcf8;   /* (지금은 사용하지 않음. 날짜 배경은 아래 .date 에서 정합니다) */
 box-sizing:border-box;                          /* (수정 금지) */
 padding-top:env(safe-area-inset-top,0px);      /* 휴대폰 위쪽 시계 영역 피하기 (수정 금지) */
 padding-bottom:env(safe-area-inset-bottom,0px);/* 휴대폰 아래쪽 영역 피하기 (수정 금지) */
}
/* ▼ 휴대폰이 '야간(다크) 모드'일 때 바뀌는 색 (아래 두 줄은 같은 내용입니다) */
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#f0f0f0;--bg:#14181c;--p1:#2b2b1c;--p2:#1f3736;--p3:#1a1a1e;--line:#777;--card:#6e4a4a;--chip:#5a4570}}
:root[data-theme="dark"]{--ink:#f0f0f0;--bg:#14181c;--p1:#2b2b1c;--p2:#1f3736;--p3:#1a1a1e;--line:#777;--card:#6e4a4a;--chip:#5a4570}

*{box-sizing:border-box} /* 칸 크기 계산 방식 (수정 금지) */
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif;-webkit-text-size-adjust:100%} /* 전체 바탕색·글자색·글꼴. 글꼴을 바꾸려면 font-family 의 이름을 바꿉니다 */
#app{max-width:480px;margin:0 auto;min-height:100vh;position:relative} /* 앱 폭: 최대 480px. 컴퓨터에서 봐도 휴대폰 크기로 가운데 표시됩니다 */
.screen{display:none;min-height:100vh} /* 화면들은 평소엔 숨김 (수정 금지) */
.screen.on{display:block}               /* 지금 보는 화면만 보이게 함 (수정 금지) */

/* ▼ 맨 위 노란색 제목 줄 */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--y);color:#111;display:flex;align-items:center;justify-content:space-between;height:52px;padding:0 10px;border-bottom:2px solid #d9c400} /* height:52px = 제목 줄 높이, border-bottom = 아래 선 색 */
header h2{margin:0;font-size:19px;font-weight:700} /* 제목 글자 크기(19px). 키우려면 숫자를 올리세요 */
.ib{width:44px;height:44px;border:0;background:none;color:#111;cursor:pointer;display:flex;align-items:center;justify-content:center;border-radius:8px} /* 홈/화살표 버튼 크기 (44px) */
.ib:focus-visible,.big:focus-visible,.top:focus-visible{outline:3px solid #0a58ca;outline-offset:2px} /* 키보드로 선택했을 때 보이는 파란 테두리 (수정 금지) */
.ib svg{width:30px;height:30px;fill:#6b6b6b} /* 홈/화살표 아이콘 크기(30px)와 색(회색 #6b6b6b) */
.ib.sp{visibility:hidden} /* 제목을 가운데 놓기 위한 빈 자리 (수정 금지) */
.logo{cursor:default}.logo img{height:38px;width:auto;display:block} /* 로고 높이(38px). 로고를 키우려면 숫자를 올리세요 */
.gap{margin-left:3em} /* 말씀 문구 두 줄 사이의 간격 */

/* ▼ 홈 화면 */
.hero{position:relative;background:#bcd0e0 linear-gradient(180deg,#bcd0e0 0%,#c9c2b4 55%,#a7a79a 100%) center top/cover no-repeat;padding:18px 0 28px} /* 사진이 없을 때 보이는 배경색. 위·아래 여백 */
.mq{overflow:hidden;white-space:nowrap;margin:0 14px;font-size:17px;color:#111} /* 맨 위 흐르는 말씀 문구: 글자 크기 17px */
.mq span{display:inline-block;will-change:transform} /* (수정 금지) */
.hero h1{text-align:center;font-size:30px;margin:26px 0 12px;font-weight:700;color:#111} /* '1 교구 소식지' 큰 글씨 크기(30px) */
/* 날짜 칸: background 의 #f8f1fd 가 배경색입니다 (연한 보라). 바꾸려면 이 번호만 바꾸세요. 야간 모드에서도 같은 색입니다 */
.date{display:block;width:max-content;margin:0 auto 14px;background:#f8f1fd;border:2px solid #badabb;padding:4px 14px;font-weight:700;font-style:italic;color:#111} /* border = 테두리 색, font-style:italic = 기울임(없애려면 normal 로) */
table{border-collapse:collapse;width:100%} /* 표 공통 설정 (수정 금지) */

/* ▼ 나가기 버튼(걸어가는 사람 그림)과 풍선 말 — 홈 화면 왼쪽 아래 */
.exit{position:absolute;left:12px;bottom:10px;width:46px;height:46px;border:0;border-radius:50%;background:rgba(255,255,255,.75);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0} /* left/bottom = 버튼 위치(왼쪽·아래에서 떨어진 거리), width/height = 크기, 배경 = 반투명 흰색 */
.exit svg{width:30px;height:30px;fill:#111} /* 걸어가는 사람 그림의 크기(30px)와 색(검정) */
.exit:active{transform:scale(.92)} /* 누를 때 살짝 작아지는 효과 */
.tip{position:absolute;left:8px;bottom:62px;background:#333;color:#fff;font-size:14px;padding:7px 14px;border-radius:8px;max-width:calc(100% - 16px);opacity:0;pointer-events:none} /* 풍선 말: bottom:62px = 버튼 바로 위, 배경 짙은 회색, 글자 흰색 14px. 평소엔 투명(opacity:0)이라 안 보이고, 켜지면 곧바로 나타남. 긴 글은 화면 폭에 맞춰 줄바꿈 */
.tip::after{content:"";position:absolute;left:20px;top:100%;border:7px solid transparent;border-top-color:#333} /* 풍선 아래의 작은 삼각형 꼬리 (색은 위의 #333 과 같게) */
.tip.on{opacity:1} /* 풍선 말이 나타날 때 */

/* ▼ 종료 화면: 나가기를 눌러도 창이 안 닫힐 때 화면 전체를 덮어 보여 주는 안내 화면 */
.bye{display:none;position:fixed;top:0;left:0;right:0;bottom:0;z-index:20;background:var(--bg);color:var(--ink);align-items:center;justify-content:center;text-align:center;padding:24px} /* display:none = 평소엔 숨김. 배경은 연한 회색(위 색깔 모음의 --bg) */
.bye-t{font-size:22px;font-weight:700;margin:0 0 12px} /* 종료 화면 제목 글자 크기 */
.bye-m{font-size:16px;line-height:1.7;margin:0 0 26px} /* 종료 화면 안내 글자 크기·줄 간격 */
.bye-b{width:160px;height:48px;border:2px solid #1b1b1b;border-radius:8px;background:#7b2ff7;color:#fff;font-size:18px;font-family:inherit;cursor:pointer} /* '다시 보기' 버튼: 크기 160×48, 보라색 */

/* ▼ '주간충현 불러오는 중' 화면: 주간충현 버튼을 누르는 순간 화면 전체를 덮어 "누른 것이 접수되었다"고 알려 줍니다 */
.ld{display:none;position:fixed;top:0;left:0;right:0;bottom:0;z-index:30;background:var(--bg);color:var(--ink);align-items:center;justify-content:center;text-align:center;padding:24px} /* display:none = 평소엔 숨김 */
.ld-s{width:48px;height:48px;margin:0 auto 20px;border:5px solid #c9d3f0;border-top-color:#2b4db8;border-radius:50%;animation:spin 1s linear infinite} /* 빙글빙글 도는 동그라미: 크기 48px, 색 파랑 */
@keyframes spin{to{transform:rotate(360deg)}} /* 도는 동작 (수정 금지) */
.ld-t{font-size:20px;font-weight:700;margin:0 0 10px} /* 제목 글자 크기 */
.ld-m{font-size:15px;line-height:1.7;margin:0 0 24px;min-height:52px} /* 안내 글자 크기·줄 간격 */
.ld-b{width:140px;height:44px;border:2px solid #1b1b1b;border-radius:8px;background:#fff;color:#111;font-size:16px;font-family:inherit;cursor:pointer} /* '취소' 버튼 */

/* ▼ 교구모임기도 표 (홈 화면 가운데) */
.gi{margin:0 8px;width:calc(100% - 16px);color:#fff;text-align:center;font-size:13px} /* 표 전체 글자 크기 13px */
.gi td{border:1px solid #fff;padding:6px 2px} /* 칸 테두리(흰색)와 칸 안 여백 */
.gi .h{background:var(--gray);color:#111;width:20%;font-weight:700;white-space:nowrap} /* '교구모임 / 기도' 글자가 있는 칸(회색). nowrap = 글자 중간에서 멋대로 줄이 바뀌지 않게 함 */
.gi .d{background:var(--brown);color:#111;font-weight:700} /* 날짜 칸. 색은 위의 --brown 에서 바꿉니다 */
.gi .n{background:#d8cbc0;color:#111;font-size:12px} /* 이름('○○○ 순') 칸. background 의 번호가 배경색입니다 */

/* ▼ 홈 화면의 보라/초록/청록 버튼 3개 */
.btns{display:flex;flex-direction:column;align-items:center;gap:26px;padding:56px 0 64px} /* gap = 버튼 사이 간격(26px), padding = 위·아래 여백 */
.big{width:196px;height:54px;border:2px solid #1b1b1b;border-radius:8px;color:#fff;font-size:20px;font-family:inherit;cursor:pointer} /* 버튼 크기(196×54), 글자 크기 20px, 글자색 흰색 */
.b1{background:#7b2ff7}.b2{background:#2f6b2f}.b3{background:#2c7a74} /* 버튼 색: 교회소식(보라) / 교구소식(초록) / 환우명단(청록) */
.b4{background:#2b4db8;color:#fff} /* 주간충현 버튼 색: 짙은 파랑 #2B4DB8, 글자는 흰색. (더 어두운 남색을 원하면 #1e3a8a) */
a.big{display:flex;align-items:center;justify-content:center;text-decoration:none} /* 주간충현은 '링크'라서 버튼처럼 보이게 하는 설정 (크기는 위 .big 과 같음) — 수정 금지 */
.big:active{transform:scale(.97)} /* 누를 때 살짝 작아지는 효과 */

/* ▼ 홈 화면 맨 아래 표 (교구 협력 교회 + 교구장·교역자·심방전도사·간사) */
.info{width:100%;color:#111} /* 표 전체 글자색 */
.info td{border:1px solid #444;padding:7px 6px;text-align:center;font-size:13px;vertical-align:top} /* 칸 테두리 색, 여백, 글자 크기 13px */
.gold{background:var(--gold)}.pink{background:#d9d9d9;color:#111} /* 위 줄: 금색 / 아래 줄(직책): 회색(#d9d9d9). 회색 농도를 바꾸려면 번호를 바꾸세요 */
.info .l{font-weight:700;text-align:left;line-height:1.6} /* 협력교회 글자: 굵게, 왼쪽 정렬, 줄 간격 */
.pink td{padding:7px 2px} /* 직책 칸의 좌우 여백(줄이면 전화번호가 한 줄에 들어갑니다) */
.tel{white-space:nowrap;font-size:12px} /* 전화번호: 줄바꿈 없이 한 줄로, 글자 크기 12px */
.nm{white-space:nowrap;font-size:12px}  /* 직책 칸의 이름: 줄바꿈 없이 한 줄로, 글자 크기 12px */
.pt{display:flex;gap:6px;padding:1px 0} /* 협력교회 한 줄: 번호와 교회 이름을 나란히 */
.pt .no{flex:none;width:1.4em;text-align:center} /* 번호 칸 너비를 똑같이 맞춰 줄이 가지런해집니다 */

/* ▼ 교회 소식 / 교구 소식 / 환우 명단 화면 */
.panel{padding:18px 18px 8px;font-size:16px;line-height:1.7} /* 본문 글자 크기 16px, 줄 간격 1.7배. 글자를 키우려면 16 을 올리세요 */
#church .panel{background:var(--p1)}#parish .panel{background:var(--p2)}#patients .panel{background:var(--p3);padding:0} /* 화면별 배경색 (위 색깔 모음의 p1, p2, p3) */
.item{margin-bottom:26px} /* 소식 항목 사이의 간격 */
.item b{display:block;margin-bottom:6px} /* 소식 제목(굵은 글씨) 아래 간격 */
.item p{margin:0 0 4px} /* 소식 내용 줄 사이의 간격 */
.top{display:flex;margin:10px auto 0;width:48px;height:48px;border:0;background:none;color:var(--ink);cursor:pointer;align-items:center;justify-content:center} /* 맨 아래 '맨 위로' 버튼 */
.top svg{width:30px;height:30px;fill:currentColor} /* '맨 위로' 화살표 크기 */
.pad{padding-bottom:20px} /* 맨 아래 여백 */
.row{display:flex;border-bottom:1px solid var(--line)} /* 환우 명단 한 줄(1목, 2목…)과 아래 선 */
.row .k{width:62px;flex:none;display:flex;align-items:center;justify-content:center;font-size:20px;border-right:1px solid var(--line);padding:14px 0} /* 왼쪽 '1목' 칸: 너비 62px, 글자 크기 20px */

  c=t.charAt(i);
  if(q){ /* 따옴표 안: 쉼표·줄바꿈도 글자로 취급 */
   if(c==='"'){if(t.charAt(i+1)==='"'){f+='"';i++}else{q=false}}else{f+=c}
  }else if(c==='"'){q=true}
  else if(c===","){row.push(f);f=""} /* 쉼표 = 다음 칸 */
  else if(c==="\n"||c==="\r"){ /* 줄바꿈 = 다음 줄 */
   if(c==="\r"&&t.charAt(i+1)==="\n")i++;
   row.push(f);f="";rows.push(row);row=[];
  }else{f+=c}
 }
 if(f!==""||row.length){row.push(f);rows.push(row)}
 return rows;
}
function cl(s){return String(s==null?"":s).replace(/^\s+|\s+$/g,"")} /* 칸 앞뒤의 빈칸 제거 — 수정 금지 */

/* 시트의 탭 하나를 읽어 옵니다. 실패하면 오류를 냅니다 — 수정 금지 */
function fetchTab(name){
 var url="https://docs.google.com/spreadsheets/d/"+SHEET_ID+"/gviz/tq?tqx=out:csv&headers=1&sheet="+encodeURIComponent(name); /* headers=1 : 맨 윗줄 1줄만 제목 줄로 보라는 뜻. 이게 없으면 구글이 글자로만 된 윗부분 여러 줄을 제목으로 합쳐 버려 내용이 읽히지 않습니다 — 수정 금지 */
 var req=fetch(url,{cache:"no-store"}).then(function(r){
  if(!r.ok)throw new Error("HTTP "+r.status);
  return r.text();
 }).then(function(t){
  if(t.charAt(0)==="<")throw new Error("공유 설정 확인 필요"); /* 로그인 화면(HTML)이 오면 공유가 막힌 것 */
  return parseCsv(t);
 });
 var limit=new Promise(function(_,no){setTimeout(function(){no(new Error("시간 초과"))},FETCH_TIMEOUT)});
 return Promise.race([req,limit]);
}

/* ▼ 탭별로 읽은 표를 DATA 에 넣어 주는 함수들 (내용이 비었거나 모양이 이상하면 넣지 않고 기본값 유지) — 수정 금지 */
function applyHome(rows){ /* '홈' 탭: 구분(왼쪽 칸)을 이름표로 찾아서 읽습니다 */
 var m={};
 rows.slice(1).forEach(function(r){m[cl(r[0])]=[cl(r[1]),cl(r[2])]});
 var v=[m["말씀 문구 1"],m["말씀 문구 2"]].map(function(x){return x?x[0]:""}).filter(function(s){return s});
 if(v.length)DATA.verse=v;
 if(m["소식지 날짜"]&&m["소식지 날짜"][0])DATA.date=m["소식지 날짜"][0];
 var pr=[];
 for(var i=1;i<=4;i++){var p=m["교구모임기도 "+i+"주"];if(p&&(p[0]||p[1]))pr.push([p[0],p[1]])}
 if(pr.length===4)DATA.prayer=pr;
 var w=m["주간충현 번호"]; /* ★ 주간충현 주소 끝 번호: 시트 '홈' 탭에 '주간충현 번호' 줄을 만들고 '내용 1' 칸에 번호를 적습니다 */
 if(w){var n=cl(w[0]).match(/(\d+)\s*$/);if(n)DATA.weekly=n[1]} /* 숫자만 뽑아 사용 (http 주소 전체를 적어도 끝 번호만 사용) */
}
function applyNews(rows,key){ /* '교회소식'/'교구소식' 탭: 제목 + 내용 1~6줄 */
 var out=[];
 rows.slice(1).forEach(function(r){
  var t=cl(r[0]);if(!t)return; /* 제목이 비었으면 건너뜀 */
  var l=r.slice(1,7).map(cl).filter(function(s){return s});
  out.push({t:(out.length+1)+". "+t,l:l}); /* 번호(1. 2. 3.)는 앱이 자동으로 붙임 */
 });
 if(out.length)DATA[key]=out;
}
function applyPatients(rows){ /* '환우명단' 탭: 목(구역) + 환우 1~12 */
 var out=[];
 rows.slice(1).forEach(function(r){
  var k=cl(r[0]);if(!k)return;
  out.push([k,r.slice(1,13).map(cl).filter(function(s){return s})]);
 });
 if(out.length)DATA.patients=out;
}
function applyOfficers(rows){ /* '교역자' 탭: 직책, 이름 1, 전화번호 1, 이름 2, 전화번호 2 */
 var out=[];
 rows.slice(1).forEach(function(r){
  var k=cl(r[0]);if(!k)return;
  var o=[k];
  for(var i=1;i<r.length;i+=2){if(cl(r[i])){o.push(cl(r[i]),cl(r[i+1]))}}
  out.push(o);
 });
 if(out.length)DATA.officers=out;
}
function applyPartners(rows){ /* '협력교회' 탭: 번호, 교회 이름(목사님) */
 var out=[];
 rows.slice(1).forEach(function(r){if(cl(r[1]))out.push([cl(r[0]),cl(r[1])])});
 if(out.length)DATA.partners=out;
}

/* 휴대폰에 저장해 둔 지난번 내용을 불러옵니다 (인터넷이 느리거나 안 될 때 도움) — 수정 금지 */
function loadCache(){
 try{
  var c=JSON.parse(localStorage.getItem(CACHE_KEY)||"null");
  if(c)for(var k in c){if(c[k])DATA[k]=c[k]}
 }catch(e){} /* 저장소를 못 쓰는 환경이면 그냥 넘어감 */
}
function saveCache(){try{localStorage.setItem(CACHE_KEY,JSON.stringify(DATA))}catch(e){}}

/* 시트 6개 탭을 읽어 DATA 에 넣고 화면을 다시 그립니다 — 수정 금지 */
function loadSheet(){
 if(!window.fetch||!window.Promise){warmUp(document.getElementById("weekly").href);return} /* 아주 오래된 휴대폰이면 기본값만 사용 */
 var jobs=[["홈",applyHome],["교회소식",function(r){applyNews(r,"church")}],["교구소식",function(r){applyNews(r,"parish")}],["환우명단",applyPatients],["교역자",applyOfficers],["협력교회",applyPartners]];
 Promise.all(jobs.map(function(j){
  return fetchTab(j[0]).then(function(rows){j[1](rows);return true}).catch(function(e){if(window.console)console.log("시트 읽기 실패:",j[0],e.message);return false});
 })).then(function(res){
  if(res.some(function(x){return x})){ /* 하나라도 성공했으면 */
   saveCache();build();
   if(document.getElementById("home").classList.contains("on"))startMq();
  }
  warmUp(document.getElementById("weekly").href); /* 주간충현 번호가 확정된 뒤 미리 받기 요청 */
 });
}

/* 소식지 날짜 자동 계산: 휴대폰 날짜 기준 '돌아오는 일요일'(오늘이 일요일이면 오늘) — 수정 금지.
   교구모임기도 4칸의 날짜: 그 달의 일요일들. 일요일이 5번인 달은,
   소식지 날짜가 첫째 일요일이면 앞의 4번, 아니면 뒤의 4번을 사용합니다. */
function autoDates(){
 var n=new Date(),d=new Date(n.getFullYear(),n.getMonth(),n.getDate());
 d.setDate(d.getDate()+(7-d.getDay())%7); /* 오늘 → 돌아오는 일요일 */
 var y=d.getFullYear(),m=d.getMonth(),sun=[],i;
 for(i=1;i<=31;i++){var x=new Date(y,m,i);if(x.getMonth()===m&&x.getDay()===0)sun.push(i)} /* 그 달의 일요일 날짜들 */
 var idx=sun.indexOf(d.getDate()),st=sun.length>4?(idx===0?0:sun.length-4):0;
 return{date:y+"년 "+(m+1)+"월 "+d.getDate()+"일",days:sun.slice(st,st+4).map(function(s){return(m+1)+"월 "+s+"일"})};
}

/* =====================================================================
   ② -3  주간충현 열기 (누르면 바로 "불러오는 중" 화면 → 서버가 응답하면 주간충현으로 이동)

var LOADING_TITLE="주간충현을 여는 중입니다";   /* 불러오는 화면 제목 */
var LOADING_MSG="잠시만 기다려 주세요.";          /* 처음 보이는 안내 글자 */
var LOADING_SLOW_MS=8000;                         /* 이 시간(8000 = 8초)이 지나도 안 열리면 아래 '느림 안내'로 바꿉니다 */
var LOADING_SLOW_MSG="서버 응답이 느립니다.\n계속 기다리시거나 '취소'를 눌러 주세요."; /* 느릴 때 안내 글자. \n 은 줄바꿈 */

var WEEKLY_EXTERNAL=true; /* ★ true = 카카오톡 안에서 눌렀을 때 휴대폰 기본 브라우저(크롬·사파리)로 열기 (카카오톡 안의 브라우저는 느려서) / false = 카카오톡 안에서 그대로 열기. 카카오톡이 아닌 곳에서는 이 값과 관계없이 그대로 이동합니다 */
var EXTERNAL_MSG="인터넷 앱(크롬·사파리)으로\n주간충현을 여는 중입니다."; /* 기본 브라우저로 열 때 잠깐 나오는 안내 글자. \n 은 줄바꿈 */
var EXTERNAL_WAIT=3000;   /* 기본 브라우저가 열리기를 기다리는 시간. 1000 = 1초. 이 시간 뒤에도 이 화면이 그대로면 열리지 않은 것이므로 카카오톡 안에서 그대로 엽니다 */
var WARMUP=true;     /* true = 앱이 열리면 주간충현 첫 페이지를 미리 받아 두도록 요청 / false = 안 함. (브라우저에 따라 효과가 없을 수 있습니다) */
var ldTimer=null;    /* 느림 안내 예약 시계 — 수정 금지 */
var warmed="";       /* 이미 미리 받기를 요청한 주소 — 수정 금지 */
function showLoading(){ /* 불러오는 중 화면 보이기 — 수정 금지 */
 document.getElementById("ldT").textContent=LOADING_TITLE;
 document.getElementById("ldM").textContent=LOADING_MSG;
 document.getElementById("ldB").textContent=LOADING_CANCEL;
 document.getElementById("ld").style.display="flex";
 clearTimeout(ldTimer);
 ldTimer=setTimeout(function(){document.getElementById("ldM").innerHTML=esc(LOADING_SLOW_MSG).replace(/\n/g,"<br>")},LOADING_SLOW_MS); /* 오래 걸리면 안내 글자 교체 */
}
function hideLoading(){clearTimeout(ldTimer);document.getElementById("ld").style.display="none"} /* 불러오는 중 화면 숨기기 — 수정 금지 */
function openExternal(u){ /* 카카오톡 전용 명령으로 휴대폰 기본 브라우저에서 주소 열기 — 수정 금지 */
 showLoading();
 document.getElementById("ldT").textContent=LOADING_TITLE;
 document.getElementById("ldM").innerHTML=esc(EXTERNAL_MSG).replace(/\n/g,"<br>");
 clearTimeout(ldTimer); /* 이 경우엔 '서버 느림' 안내로 바꾸지 않음 */
 location.href="kakaotalk://web/openExternal?url="+encodeURIComponent(u); /* 카카오톡이 알아듣는 '외부 브라우저로 열기' 주소 (아이폰·안드로이드 공통) */
 setTimeout(function(){
  if(document.visibilityState==="visible"){ /* 3초 뒤에도 이 화면이 보이면 = 기본 브라우저가 안 열림 → 카카오톡 안에서 그대로 엽니다 */
   showLoading();location.href=u;
  }else{hideLoading()} /* 기본 브라우저가 열려 이 화면이 뒤로 갔으면 안내 화면만 정리 */
 },EXTERNAL_WAIT);
}
document.getElementById("weekly").addEventListener("click",function(e){ /* 주간충현 버튼을 누르면 — 수정 금지 */
 if(WEEKLY_EXTERNAL&&/kakaotalk/i.test(navigator.userAgent)){e.preventDefault();openExternal(this.href);return} /* 카카오톡 안이면 기본 브라우저로 */
 showLoading(); /* 그 밖에는: '불러오는 중' 화면을 먼저 덮고, 링크 이동은 그대로 진행 */
});
document.getElementById("ldB").addEventListener("click",function(){ /* '취소': 로딩을 멈추고 홈으로 돌아옴 — 수정 금지 */
 try{window.stop()}catch(e){}
 hideLoading();
});
window.addEventListener("pageshow",hideLoading); /* 주간충현에서 '뒤로가기'로 돌아왔을 때 불러오는 화면이 남아 있지 않게 함 — 수정 금지 */
function warmUp(u){ /* 주간충현 첫 페이지를 미리 받아 두도록 브라우저에 요청 (같은 주소는 한 번만) — 수정 금지 */

   ③ 이 아래는 "화면을 만들어 주는 프로그램"입니다.

/* 글자 속의 특수문자(< > &)가 화면을 망가뜨리지 않게 바꿔 주는 도구 — 수정 금지 */
function esc(s){return String(s).replace(/[&<>]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;"}[c]})}

/* ★ 위의 '데이터'를 읽어서 모든 화면의 내용을 채워 넣는 부분입니다 */
function build(){
 /* 흐르는 말씀 문구 채우기 */
 document.getElementById("mqt").innerHTML=DATA.verse.map(function(v,i){return '<span'+(i?' class="gap"':'')+'>'+esc(v)+'</span>'}).join("");
 /* 날짜 채우기: AUTO_DATE 가 true 면 휴대폰 날짜(일요일 기준) 사용, false 면 시트/기본값 사용 */
 var A=autoDates(),dateTxt=AUTO_DATE?A.date:DATA.date;
 var prayer=DATA.prayer.map(function(p,i){return[AUTO_DATE&&A.days[i]?A.days[i]:p[0],p[1]]}); /* 날짜는 자동, 이름('○○○ 순')은 시트에서 */
 document.getElementById("date").textContent=dateTxt;
 /* 주간충현 버튼 링크 채우기: 앞부분(WEEKLY_BASE) + 시트의 번호 */
 document.getElementById("weekly").href=WEEKLY_BASE+DATA.weekly;
 /* 교구모임기도 표 채우기. 수정 가능: 아래 '교구모임<br>기도' 는 표 왼쪽 칸에 나오는 이름입니다. <br> 은 줄바꿈이므로 '교구모임' 아래 줄에 '기도'가 나옵니다. 한 줄로 쓰려면 <br> 을 지우세요 */

 document.getElementById("info").innerHTML='<tr class="gold"><td style="width:1%;white-space:nowrap;font-weight:700;font-size:12px;padding:6px 4px;vertical-align:middle">교구 협력 교회</td><td class="l" colspan="3">'+partnersHtml()+'</td></tr><tr class="pink">'+DATA.officers.map(officerHtml).join('')+'</tr>';

 document.getElementById("church").innerHTML=head("church")+'<div class="panel">'+list(DATA.church)+'</div><div class="panel pad" style="padding-top:0">'+topBtn()+'</div>';
 /* 교구 소식 화면 채우기 */
 document.getElementById("parish").innerHTML=head("parish")+'<div class="panel">'+list(DATA.parish)+'</div><div class="panel pad" style="padding-top:0">'+topBtn()+'</div>';
 /* 환우 명단 화면 채우기. 수정 가능: '건강하시기를 기원합니다!' 는 맨 아래 인사말입니다 */
 document.getElementById("patients").innerHTML=head("patients")+'<div class="panel">'+DATA.patients.map(function(r){return '<div class="row"><div class="k">'+esc(r[0])+'</div><div class="v">'+r[1].map(function(n){return '<span>'+esc(n)+'</span>'}).join('')+'</div></div>'}).join('')+'<div class="foot">건강하시기를 기원합니다!</div>'+topBtn()+'<div class="pad"></div></div>';

/* 선택한 화면만 보여 주고 나머지는 숨깁니다 — 수정 금지 */
function show(name){
 if(ORDER.indexOf(name)<0)name="home";
 ORDER.forEach(function(n){document.getElementById(n).classList.toggle("on",n===name)});
 window.scrollTo(0,0);
 if(name==="home")startMq();
}

/* 버튼을 눌렀을 때의 동작 — 수정 금지.
   (이동 버튼이면 해당 화면으로, '맨 위로' 버튼이면 부드럽게 맨 위로 올라갑니다) */
document.addEventListener("click",function(e){
 var g=e.target.closest("[data-go]");
 if(g){location.hash=g.getAttribute("data-go");return}
 if(e.target.closest(".top")){window.scrollTo({top:0,behavior:"smooth"})}
});
window.addEventListener("hashchange",function(){show(location.hash.slice(1))}); /* 주소 뒤의 #church 같은 표시가 바뀌면 그 화면을 보여 줌 — 수정 금지 */

/* 말씀 문구: 왼쪽으로 흐르다 끝에 닿으면 처음 위치로 돌아옵니다.
   수정 가능: 아래 줄의 숫자 22 를 키우면 더 천천히, 줄이면 더 빨리 흐릅니다. (3000 = 처음에 멈춰 있는 시간) */
function startMq(){
 var box=document.getElementById("mq"),t=document.getElementById("mqt");
 t.getAnimations().forEach(function(a){a.cancel()});
 var d=t.scrollWidth-box.clientWidth;
 if(d<=0||matchMedia("(prefers-reduced-motion:reduce)").matches)return;
 t.animate([{transform:"translateX(0)",offset:0},{transform:"translateX(0)",offset:.08},{transform:"translateX(-"+d+"px)",offset:.92},{transform:"translateX(-"+d+"px)",offset:1}],{duration:d*22+3000,iterations:Infinity});
}
window.addEventListener("resize",function(){if(document.getElementById("home").classList.contains("on"))startMq()}); /* 화면 크기가 바뀌면 문구 흐름을 다시 맞춤 — 수정 금지 */

/* =====================================================================
   ④ 나가기 (걸어가는 사람 그림을 눌렀을 때)
   ---------------------------------------------------------------------
   순서: ① 손가락이 닿자마자 풍선 말 "나가기" 표시  →  ② 잠깐 기다림  →  ③ 앱 종료
   ★ 카카오톡 링크로 열었을 때는 카카오톡 안의 창이 닫힙니다.
   ★ 일반 인터넷 앱(크롬, 사파리 등)은 보안 때문에 스스로 닫히지 않을 수 있습니다.
      그럴 때는 화면 전체가 "종료 화면"으로 바뀌어, 앱이 끝난 것처럼 보이고
      닫는 방법을 안내합니다. ("다시 보기"를 누르면 처음 화면으로 돌아옵니다)
   수정 가능한 값은 아래와 같습니다.
   ===================================================================== */
var TIP_TEXT="나가기";   /* 풍선 말 글자 */
var EXIT_DELAY=1500;      /* 풍선이 보인 뒤 종료되기까지 기다리는 시간. 1000 = 1초 (1500 = 1.5초). 더 오래 보이게 하려면 숫자를 올리세요 */
/* ▼ 창이 안 닫힐 때 나오는 '종료 화면'의 글자 (수정 가능) */
var BYE_TITLE="소식지를 종료했습니다";   /* 종료 화면 제목 */
var BYE_MSG="화면 위의 X 버튼 또는\n휴대폰의 뒤로가기를 눌러\n창을 닫아 주세요.";   /* 안내 글자. \n 은 줄바꿈입니다 */
var BYE_BTN="다시 보기";                  /* 종료 화면의 버튼 글자 */
var exiting=false; /* 나가기가 이미 진행 중인지 표시 (여러 번 눌러도 한 번만 실행) — 수정 금지 */
var tipTimer=null; /* 풍선을 숨기는 예약 시계 — 수정 금지 */
function showTip(text,ms){ /* 풍선 말을 곧바로 보여 줍니다. ms(1000=1초)를 적으면 그 시간 뒤에 숨김 — 수정 금지 */
 var tip=document.getElementById("tip");
 clearTimeout(tipTimer);
 tip.textContent=text;
 tip.classList.add("on");
 if(ms){tipTimer=setTimeout(function(){tip.classList.remove("on")},ms)}
}
function doExit(){ /* 실제로 앱을 닫는 부분 — 수정 금지 */
 var ua=navigator.userAgent.toLowerCase();
 if(/kakaotalk/.test(ua)){ /* 카카오톡 안에서 열렸다면: 카카오톡 전용 닫기 명령 (아이폰/안드로이드가 다름) */
  location.href=/iphone|ipad|ipod/.test(ua)?"kakaoweb://closeBrowser":"kakaotalk://inappbrowser/close";
 }else{
  window.close(); /* 일반 인터넷 앱: 창 닫기 시도 */
 }
 setTimeout(function(){ /* 0.8초 뒤에도 이 화면이 남아 있으면 = 닫히지 않은 것 → 종료 화면을 보여 줌 */
  showBye();
 },800);
}
function showBye(){ /* 종료 화면을 보여 줍니다 — 수정 금지 */
 document.getElementById("byeT").textContent=BYE_TITLE;
 document.getElementById("byeM").innerHTML=esc(BYE_MSG).replace(/\n/g,"<br>"); /* \n 을 줄바꿈으로 바꿈 */
 document.getElementById("byeB").textContent=BYE_BTN;
 document.getElementById("tip").classList.remove("on");
 document.getElementById("bye").style.display="flex";
}
document.getElementById("byeB").addEventListener("click",function(){ /* '다시 보기' 버튼: 종료 화면을 닫고 홈으로 돌아감 — 수정 금지 */
 document.getElementById("bye").style.display="none";
 exiting=false;
 location.hash="home";
 show("home");
});
var exitBtn=document.getElementById("exit");
exitBtn.addEventListener("pointerdown",function(){ /* ① 손가락이 닿는 순간 풍선 말을 먼저 보여 줍니다 — 수정 금지 */
 if(exiting)return;
 showTip(TIP_TEXT);
});
exitBtn.addEventListener("click",function(){ /* ② 손가락을 떼면 잠깐 뒤에 종료합니다 — 수정 금지 */
 if(exiting)return;
 exiting=true;
 showTip(TIP_TEXT);              /* (안전하게 한 번 더) 풍선 말 표시 */
 setTimeout(doExit,EXIT_DELAY);  /* 풍선을 보여 준 뒤 종료 */
});
exitBtn.addEventListener("pointercancel",function(){ /* 누르다가 손가락이 벗어나 취소되면 풍선을 숨깁니다 — 수정 금지 */
 if(!exiting){document.getElementById("tip").classList.remove("on")}
});

/* ▼ 앱을 시작하는 부분 — 수정 금지.
   맨 아래 그림 데이터가 모두 준비된 뒤에 호출(실행)됩니다. */
function startApp(){
 attachImages();               /* 로고와 배경 사진 붙이기 */
 loadCache();                  /* 휴대폰에 저장된 지난번 내용 불러오기 (바로 보이게) */
 build();                      /* 화면 내용 채우기 (먼저 기본값/저장값으로 즉시 표시) */
 loadSheet();                  /* 구글 시트에서 최신 내용 읽어 와서 화면 갱신 */
 show(location.hash.slice(1)); /* 첫 화면(홈) 보여 주기 */
 if(document.fonts&&document.fonts.ready)document.fonts.ready.then(function(){if(document.getElementById("home").classList.contains("on"))startMq()}); /* 글꼴이 준비되면 문구 흐름 다시 맞춤 */
}
</script>
